name: 问题反馈 / Bug report
description: 投屏失败、卡顿、手机上找不到电视、闪退等 / Casting fails, stutters, the TV doesn't show up, crashes
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        先看看 [常见问题](https://github.com/Jaqennn/LiteCast#常见问题)，找不到电视、清晰度不高这类情况那里有解决办法。
        Please check the [FAQ](https://github.com/Jaqennn/LiteCast/blob/main/README.en.md#faq) first.
  - type: textarea
    id: problem
    attributes:
      label: 发生了什么 / What happens
      description: 怎么操作的、看到了什么、本来应该怎样；能截图或拍照更好 / What you did, what you saw, what you expected; photos help
    validations:
      required: true
  - type: dropdown
    id: brand
    attributes:
      label: 电视品牌 / TV brand
      description: 三星、LG 的电视不是安卓系统，暂时装不了轻投；接了电视盒子在用的，请选「电视盒子」 / Samsung and LG TVs don't run Android; if you use a TV box, pick "TV box"
      options:
        - 小米 / Redmi
        - 海信 / Vidda
        - TCL / 雷鸟
        - 创维 / 酷开
        - 索尼 Sony
        - 长虹
        - 康佳
        - 海尔
        - 夏普 Sharp
        - 东芝 Toshiba
        - 飞利浦 Philips
        - 松下 Panasonic
        - 乐视
        - 华为 / 荣耀
        - 三星 Samsung
        - LG
        - 电视盒子（小米盒子、当贝、天猫魔盒等）/ TV box
        - 投影仪（极米、当贝、坚果等）/ Projector
        - 其他（写在下面）/ Other (say which below)
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: 电视型号（知道就填）/ Model (if you know it)
      description: 一般在电视的 设置 → 关于（或「本机信息」「设备信息」）里，也可以看电视背面的标签。不知道就不填 / Usually in Settings → About, or on the label on the back. Leave it empty if unsure
      placeholder: KD-65X90J
  - type: dropdown
    id: android
    attributes:
      label: 安卓版本（知道就选）/ Android version (if you know it)
      description: 一般在 设置 → 关于 里 / Usually in Settings → About
      options:
        - 不知道 / Not sure
        - Android 4.x 或更老 / or older
        - Android 5
        - Android 6
        - Android 7
        - Android 8
        - Android 9
        - Android 10
        - Android 11
        - Android 12
        - Android 13
        - Android 14 或更新 / or newer
  - type: input
    id: version
    attributes:
      label: 轻投版本 / LiteCast version
      placeholder: "0.2.0"
  - type: input
    id: phone
    attributes:
      label: 手机型号和系统 / Phone and OS
      placeholder: iPhone 15，iOS 26
  - type: input
    id: app
    attributes:
      label: 怎么投的 / How you cast
      description: 屏幕镜像，还是哪个 App 的投屏按钮 / Screen mirroring, or the cast button of which app
      placeholder: B 站的投屏按钮
