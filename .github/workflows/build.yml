name: Build

# Every push and pull request: unit tests, lint and a debug APK. Publishing a signed release is
# a separate workflow, release.yml, so no signing key is ever used here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Unit tests and lint
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug

      - name: Build debug APK
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          ./gradlew --stacktrace assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "LiteCast-$version-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LiteCast-debug
          path: LiteCast-*-debug.apk
