name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Unit tests and lint
        run: ./gradlew --stacktrace testDebugUnitTest lintDebug

      # Release APKs are signed with a key that is not in this repository. If the four secrets
      # below are set, a v* tag builds, signs and publishes LiteCast.apk; without them the tag
      # build only checks that everything compiles and the maintainer uploads the signed APK.
      - name: Signing key
        id: signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::No signing secrets: building a debug APK only; the release APK is uploaded by hand"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> local.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$SIGNED" = "true" ]; then
            ./gradlew --stacktrace assembleRelease
            cp app/build/outputs/apk/release/app-release.apk LiteCast.apk
          else
            ./gradlew --stacktrace assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "LiteCast-$version-debug.apk"
          fi
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: LiteCast
          path: LiteCast*.apk

      # The asset keeps one name in every release, so releases/latest/download/LiteCast.apk
      # (the README's download link) always points at the newest version
      - name: Publish release
        if: steps.signing.outputs.signed == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: LiteCast.apk
