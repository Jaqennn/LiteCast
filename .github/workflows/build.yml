name: Build

# Every push and pull request: unit tests, lint and a debug APK. Publishing a signed release is
# a separate workflow, release.yml, so no signing key is ever used here.
on:
  push:
    branches: [main, fix/airplay-session-lifecycle]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Native thread ownership regression
        run: |
          gcc -std=c11 -pthread -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" -Iapp/src/main/cpp app/src/main/cpp/android_jni_thread.c app/src/main/cpp/tests/jni_thread_test.c -o /tmp/jni-thread-test
          /tmp/jni-thread-test

      - name: Unit tests and lint
        run: ./gradlew --continue --stacktrace testDebugUnitTest lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-tests-and-lint
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Build debug APK
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          ./gradlew --stacktrace -PwithX86 assembleDebug assembleDebugAndroidTest
          python3 tools/check_native_apk.py app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "LiteCast-$version-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LiteCast-debug
          path: LiteCast-*-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LiteCast-test-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk

  compatibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            arch: x86
          - api: 22
            arch: x86
          - api: 23
            arch: x86
          - api: 31
            arch: x86_64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LiteCast-test-apks
          path: apks
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install apks/debug/app-debug.apk
            adb install apks/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e class io.github.litecast.AirPlayLifecycleTest io.github.litecast.test/androidx.test.runner.AndroidJUnitRunner | tee airplay-lifecycle.txt
            grep -Eq '^OK \(1 test\)' airplay-lifecycle.txt
            adb logcat -d > airplay-logcat.txt
            if grep -E 'Native thread exited without calling DetachCurrentThread|JNI DETECTED ERROR|Fatal signal' airplay-logcat.txt; then exit 1; fi
            adb exec-out run-as io.github.litecast cat files/airplay-lifecycle-test.txt > airplay-stages.txt
            adb shell wm size 1920x1080
            adb shell wm density 240
            adb shell am instrument -w -r -e class io.github.litecast.LegacyStartupTest io.github.litecast.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            grep -Eq '^OK \(3 tests\)' instrumentation.txt
            adb exec-out run-as io.github.litecast cat files/diagnostic-preview.png > diagnostic-preview.png
            adb shell am instrument -w -r -e recoveryTest true -e class io.github.litecast.DiagnosticRecoveryTest#prepareCrashRecord io.github.litecast.test/androidx.test.runner.AndroidJUnitRunner | tee recovery-save.txt
            grep -Eq '^OK \(1 test\)' recovery-save.txt
            adb shell am force-stop io.github.litecast
            adb shell am instrument -w -r -e recoveryTest true -e class io.github.litecast.DiagnosticRecoveryTest#verifyCrashRecordAfterRestart io.github.litecast.test/androidx.test.runner.AndroidJUnitRunner | tee recovery-reload.txt
            grep -Eq '^OK \(1 test\)' recovery-reload.txt
            adb shell am instrument -w -r -e recoveryTest true -e class io.github.litecast.DiagnosticRecoveryTest#prepareInterruptedStartup io.github.litecast.test/androidx.test.runner.AndroidJUnitRunner | tee interrupted-save.txt
            grep -Eq '^OK \(1 test\)' interrupted-save.txt
            adb shell am force-stop io.github.litecast
            adb shell am instrument -w -r -e recoveryTest true -e class io.github.litecast.DiagnosticRecoveryTest#verifyInterruptedStartupAfterRestart io.github.litecast.test/androidx.test.runner.AndroidJUnitRunner | tee interrupted-reload.txt
            grep -Eq '^OK \(1 test\)' interrupted-reload.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-api-${{ matrix.api }}
          path: |
            instrumentation.txt
            airplay-*.txt
            diagnostic-preview.png
            recovery-*.txt
            interrupted-*.txt

  publish-test:
    needs: [validation, compatibility]
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/airplay-session-lifecycle'
    permissions:
      contents: write
    concurrency:
      group: airplay-prerelease
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      # Fingerprint of LiteCast's release certificate (public, not a secret). Every APK we
      # publish must carry it, or phones and TVs refuse to update over the installed app.
      EXPECTED_CERT: 334e8ebcd06328e3c4476626e96c5265319b25d1b2a8bc64ea6f0d03bca5d98c
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "21"
          cache: gradle

      - name: Version and notes
        id: meta
        env:
          DRY_RUN: false
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=docs/release-notes/$version.md" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" != "true" ]; then
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "::error::v$version is already released; raise versionName and versionCode first"
              exit 1
            fi
            if [ ! -f "docs/release-notes/$version.md" ]; then
              echo "::error::Write the release notes in docs/release-notes/$version.md first"
              exit 1
            fi
          fi

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The repository secret $name is not set"
              exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Test, lint and build
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          ./gradlew --stacktrace testDebugUnitTest lintDebug assembleRelease
          python3 tools/check_native_apk.py app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk LiteCast.apk
          rm -f "$RUNNER_TEMP/release.jks" local.properties

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --min-sdk-version 21 --print-certs LiteCast.apk > signer.txt
          if ! grep -qi "certificate SHA-256 digest: $EXPECTED_CERT" signer.txt; then
            echo "::error::LiteCast.apk is not signed with LiteCast's release key"
            exit 1
          fi
          sha256sum LiteCast.apk | cut -d' ' -f1 > LiteCast.apk.sha256
          echo "Signed with the release key; SHA-256 $(cat LiteCast.apk.sha256)"

      # The asset keeps one name in every release, so releases/latest/download/LiteCast.apk
      # (the README's download link) always points at the newest version
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          {
            cat "$NOTES"
            echo
            echo "SHA-256（LiteCast.apk）：\`$(cat LiteCast.apk.sha256)\`"
          } > body.md
          gh release create "$TAG" LiteCast.apk --prerelease --latest=false --target "$(git rev-parse HEAD)" --title "轻投 $VERSION · AirPlay 专项测试" --notes-file body.md

      - uses: actions/upload-artifact@v4
        with:
          name: airplay-native-symbols
          path: |
            app/build/outputs/native-debug-symbols/
            app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" local.properties
